# ============================================================================
# 企业报销软件用户反馈与功能改进助手 —— Nginx 配置
#
# 部署架构（前后端分离）：
#
#     浏览器 ──► Nginx :8080 ──┬─► 静态资源（前端 dist）
#                              ├─► /api/    反代到 Spring Boot :8081
#                              └─► /uploads/ 本地图片目录
#
# 用法：
#   1. 把本文件放到 nginx/conf/conf.d/feedback.conf
#   2. 修改 root / alias 路径为本机实际路径
#   3. nginx -s reload
#
# ⚠️ 注意 Windows 路径写法：
#    在 Nginx 配置里要用正斜杠 / ，不能用反斜杠 \
#    盘符写法： D:/feedback-data/uploads/
# ============================================================================

server {
    listen       8080;
    server_name  localhost;

    # 前端构建产物大小普遍较小，开启 gzip 明显改善首屏
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json
                      application/javascript text/xml application/xml;

    # ---------------------------------------------------------------
    # 1. 前端静态资源
    #    root 指向 dist 的**上层目录**，配合 try_files 实现 SPA 路由回退
    # ---------------------------------------------------------------
    location / {
        root   html/feedback-ui;
        index  index.html;

        # SPA 关键：直接访问 /issues/3 这种深链时，
        # Nginx 找不到对应文件，必须回退到 index.html 交给前端路由处理
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # 2. 后端接口反代
    #
    # ⚠️ proxy_pass 结尾的斜杠很关键：
    #    本项目后端 Controller 的映射本身就带 /api 前缀
    #    （例如 @RequestMapping("/api/feedbacks")），
    #    所以转发时必须**保留** /api，proxy_pass 结尾不能加斜杠。
    #
    #    若写成 proxy_pass http://127.0.0.1:8081/;（带斜杠），
    #    Nginx 会把 /api/feedbacks 改写成 /feedbacks 再转发，
    #    后端将全部返回 404 —— 这是最常见的反代踩坑点。
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # AI 调用可能较慢，读写超时放宽一些
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;
    }

    # ---------------------------------------------------------------
    # 3. 上传的图片（本地存储模式）
    #    若改用 OSS，这一段可以整段删掉
    # ---------------------------------------------------------------
    location /uploads/ {
        alias D:/feedback-data/uploads/;

        # 图片长期不变，缓存 7 天
        expires 7d;
        add_header Cache-Control "public";

        # 防止有人在上传目录放脚本并执行
        location ~ \.(php|jsp|asp|sh|bat)$ {
            deny all;
        }
    }

    # ---------------------------------------------------------------
    # 4. 错误页
    # ---------------------------------------------------------------
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
